# Test-only RSA key pair. Never use these fixtures outside test scope.
quarkus.kafka.devservices.image-name=redpandadata/redpanda:v24.1.2
mp.jwt.verify.publickey.location=target/test-classes/jwt/test-jwks.json
numou.identity.jwt.active-public-key.location=target/test-classes/jwt/test-publicKey.pem
smallrye.jwt.sign.key.location=jwt/test-privateKey.pem

# Test audience for the OAuth client credentials JWT issuer.
numou.oauth.access-token.audience=numou-api
numou.oauth.access-token.lifespan-seconds=300
numou.identity.jwt.signing-key-id=test-identity-key
numou.oauth.access-token.jwks.location=target/test-classes/jwt/test-jwks.json
