# Illustrative configuration - values are placeholders. Real secrets
# (DB password, Kafka credentials) belong in environment variables or
# a secrets manager, never committed here.

quarkus.application.name=identity-service

quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=vertx-reactive:postgresql://localhost:5432/numou_identity
quarkus.datasource.username=numou_identity
quarkus.datasource.password=${IDENTITY_DB_PASSWORD:changeit}
# Production must supply a real secret; there is intentionally no production fallback.
%prod.quarkus.datasource.password=${IDENTITY_DB_PASSWORD}

quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true

mp.messaging.outgoing.identity-events.connector=smallrye-kafka
mp.messaging.outgoing.identity-events.topic=identity.user-events
mp.messaging.outgoing.identity-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Public local-password login throttling. This is a per-process guard;
# enforce a shared/global limit at the trusted ingress for multi-replica deployments.
numou.identity.login-rate-limit.enabled=${IDENTITY_LOGIN_RATE_LIMIT_ENABLED:true}
numou.identity.login-rate-limit.capacity=${IDENTITY_LOGIN_RATE_LIMIT_CAPACITY:10}
numou.identity.login-rate-limit.refill-per-second=${IDENTITY_LOGIN_RATE_LIMIT_REFILL_PER_SECOND:0.1}
numou.identity.login-rate-limit.max-keys=${IDENTITY_LOGIN_RATE_LIMIT_MAX_KEYS:100000}

quarkus.http.port=8081
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/numou_identity

%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.application-type=service
quarkus.oidc.client-id=${OIDC_CLIENT_ID:numou-identity}
# OAuth client scopes are also the only role source for service-token @RolesAllowed checks.
quarkus.oidc.roles.role-claim-path=groups
smallrye.jwt.path.groups=groups

# OAuth 2.0 client credentials token endpoint (configure a resource-server audience per deployment).
# Keep this value identical to the audience expected by Iket and protected APIs.
numou.oauth.access-token.audience=${NUMOU_OAUTH_ACCESS_TOKEN_AUDIENCE}
numou.oauth.access-token.lifespan-seconds=${NUMOU_OAUTH_ACCESS_TOKEN_LIFESPAN_SECONDS:300}
numou.identity.jwt.signing-key-id=${IDENTITY_JWT_SIGNING_KEY_ID}
numou.identity.jwt.active-public-key.location=${IDENTITY_JWT_PUBLIC_KEY_LOCATION}
numou.oauth.access-token.jwks.location=${IDENTITY_JWT_JWKS_LOCATION}

# --- JWT issuance & verification ---
# Production/development deployments must mount the active key pair from the
# secret manager (for example, Vault Agent) and provide these file locations.
# There is deliberately no classpath fallback: missing key configuration fails
# closed rather than silently using a repository-bundled signing key.
mp.jwt.verify.issuer=https://identity.numou.internal
mp.jwt.verify.publickey.location=${IDENTITY_JWT_JWKS_LOCATION}
smallrye.jwt.sign.key.location=${IDENTITY_JWT_PRIVATE_KEY_LOCATION}
smallrye.jwt.new-token.issuer=https://identity.numou.internal
smallrye.jwt.new-token.lifespan=900

# --- gRPC (AuthCheckService) ---
quarkus.grpc.server.port=9090
quarkus.grpc.server.use-separate-server=true

# --- Management scope path for identity administration ---
numou.identity.management-scope-path=system

quarkus.http.auth.permission.public-registration.paths=/api/identity/users
quarkus.http.auth.permission.public-registration.methods=POST
quarkus.http.auth.permission.public-registration.policy=permit

quarkus.http.auth.permission.login.paths=/api/v1/auth/login
quarkus.http.auth.permission.login.policy=permit

# V2 login issues a restricted tenant-selection credential and must be public.
# It must appear before the authenticated-api catch-all.
quarkus.http.auth.permission.tenant-login.paths=/api/v2/auth/login
quarkus.http.auth.permission.tenant-login.methods=POST
quarkus.http.auth.permission.tenant-login.policy=permit

# Public federated login flow (authorize/callback/providers) - must precede the
# authenticated-api rule below, Quarkus applies the first matching rule.
quarkus.http.auth.permission.federated.paths=/api/v1/auth/federated/*
quarkus.http.auth.permission.federated.policy=permit

quarkus.http.auth.permission.oauth-token.paths=/api/v1/oauth2/token
quarkus.http.auth.permission.oauth-token.methods=POST
quarkus.http.auth.permission.oauth-token.policy=permit

# Public verification metadata; the endpoint validates the active public key against the mounted JWKS.
quarkus.http.auth.permission.oauth-jwks.paths=/.well-known/jwks.json
quarkus.http.auth.permission.oauth-jwks.policy=permit

quarkus.http.auth.permission.authenticated-api.paths=/api/*,/api/v1/*
quarkus.http.auth.permission.authenticated-api.policy=authenticated

# --- Audit event stream: identity_outbox -> Kafka topic identity.audit-log ---
# IdentityOutboxRelay drains the outbox at-least-once with partition key
# principalId -> tenantId -> aggregateId (see IdentityOutboxRelay for the semantics).
mp.messaging.outgoing.identity-audit-log.connector=smallrye-kafka
mp.messaging.outgoing.identity-audit-log.topic=identity.audit-log
mp.messaging.outgoing.identity-audit-log.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.identity-audit-log.key.serializer=org.apache.kafka.common.serialization.StringSerializer
numou.identity.outbox.poll-interval=PT5S

# --- Federation (OIDC/OAuth2) ---
# Set to true in production behind TLS so the HttpOnly PKCE flow cookie is Secure.
numou.identity.federation.cookie-secure=false
# Federation cookies must be Secure in production deployments behind HTTPS.
%prod.numou.identity.federation.cookie-secure=true

# Internal OAuth token introspection is restricted to the dedicated service role.
quarkus.http.auth.permission.oauth-introspection.paths=/internal/v1/oauth2/introspect
quarkus.http.auth.permission.oauth-introspection.methods=POST
quarkus.http.auth.permission.oauth-introspection.policy=authenticated
