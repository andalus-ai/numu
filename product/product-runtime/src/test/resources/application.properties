# ─────────────────────────────────────────────────────────────────────────────
#  Test profile — uses H2 in-memory, no Flyway, schema auto-created
# ─────────────────────────────────────────────────────────────────────────────

# H2 in-memory datasource (Quarkus test default)
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:product_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1

# Auto-create schema from JPA entities (no Flyway needed in tests)
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.flyway.enabled=false

# Logging — verbose for test debugging
%test.quarkus.log.level=WARN
%test.quarkus.log.category."com.saas.product".level=DEBUG

# Disable Kafka in tests (use CDI event bus instead)
%test.quarkus.messaging.enabled=false
