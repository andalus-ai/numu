# ─────────────────────────────────────────────────────────────────────────────
#  Product Module — Quarkus Application Configuration
# ─────────────────────────────────────────────────────────────────────────────

quarkus.application.name=product-module
quarkus.application.version=1.0.0

# ── Datasource ────────────────────────────────────────────────────────────────

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:saas}
quarkus.datasource.password=${DB_PASS:saas}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/saas_product}

# Connection pool (HikariCP via Quarkus JDBC)
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.idle-removal-interval=5M
quarkus.datasource.jdbc.max-lifetime=30M

# ── Hibernate ORM ─────────────────────────────────────────────────────────────

quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.statistics=false

# ── Flyway ────────────────────────────────────────────────────────────────────

quarkus.flyway.enabled=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true

# ── HTTP ──────────────────────────────────────────────────────────────────────

quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

# ── OpenAPI / Swagger ────────────────────────────────────────────────────────

quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

mp.openapi.extensions.smallrye.info.title=Product Module API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=\
  Multi-domain product catalog API supporting e-commerce, FnB, subscription, and more.

# ── Jackson JSON ─────────────────────────────────────────────────────────────

quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.serialization-inclusion=non_null

# ── Logging ──────────────────────────────────────────────────────────────────

quarkus.log.level=INFO
quarkus.log.category."com.saas.product".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n

# ── Health ────────────────────────────────────────────────────────────────────

quarkus.smallrye-health.root-path=/health
