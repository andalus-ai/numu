# Import this optional configuration from the host application when the Quarkus runtime module is enabled.
numou.reservation.outbox.poll-interval=1s
numou.reservation.outbox.metrics-refresh-interval=15s
numou.reservation.outbox.batch-size=50
numou.reservation.outbox.max-attempts=12
numou.reservation.outbox.lease=PT30S
numou.reservation.outbox.initial-backoff=PT1S
numou.reservation.outbox.max-backoff=PT5M

# Configure the host's Kafka connection separately; never commit credentials.
mp.messaging.outgoing.reservation-outbox-events.connector=smallrye-kafka
mp.messaging.outgoing.reservation-outbox-events.topic=${NUMOU_RESERVATION_EVENTS_TOPIC:numou.reservation.events}
mp.messaging.outgoing.reservation-outbox-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.reservation-outbox-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.reservation-outbox-events.acks=all
mp.messaging.outgoing.reservation-outbox-events.enable.idempotence=true
mp.messaging.outgoing.reservation-outbox-events.max.in.flight.requests.per.connection=1
mp.messaging.outgoing.reservation-outbox-events.waitForWriteCompletion=true
