quarkus.application.name=syirkah-document
quarkus.http.port=8083
quarkus.http.limits.max-body-size=100M

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:syirkah_document}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.reactive.url=${DB_REACTIVE_URL:vertx-reactive:postgresql://localhost:5432/syirkah_document}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/syirkah_document}
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
quarkus.index-dependency.identity-adapter.group-id=tech.kayys.syirkah
quarkus.index-dependency.identity-adapter.artifact-id=syirkah-identity-adapter

syirkah.document.local-root=${DOCUMENT_STORAGE_ROOT:${java.io.tmpdir}/syirkah-documents}
syirkah.document.upload-base-url=${DOCUMENT_UPLOAD_BASE_URL:http://localhost:8083}
syirkah.document.max-upload-bytes=${DOCUMENT_MAX_UPLOAD_BYTES:104857600}
%prod.syirkah.document.storage=${DOCUMENT_STORAGE:s3}
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.application-type=service
quarkus.oidc.client-id=${OIDC_CLIENT_ID:syirkah-document}
%prod.quarkus.http.auth.permission.upload-token.paths=/api/v1/document-storage/uploads/*
%prod.quarkus.http.auth.permission.upload-token.methods=PUT
%prod.quarkus.http.auth.permission.upload-token.policy=permit
%prod.quarkus.http.auth.permission.document-api.paths=/api/v1/tenants/*
%prod.quarkus.http.auth.permission.document-api.policy=authenticated

mp.messaging.outgoing.document-events.connector=smallrye-kafka
mp.messaging.outgoing.document-events.topic=document.events
mp.messaging.outgoing.document-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
syirkah.document.outbox.poll-interval=${DOCUMENT_OUTBOX_POLL_INTERVAL:5s}
syirkah.document.outbox.batch-size=${DOCUMENT_OUTBOX_BATCH_SIZE:50}
syirkah.document.outbox.max-attempts=${DOCUMENT_OUTBOX_MAX_ATTEMPTS:12}
