quarkus.application.name=syirkah-accounting-service
quarkus.http.port=8081
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=postgresql://localhost:5432/syirkah_accounting
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/syirkah_accounting
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
