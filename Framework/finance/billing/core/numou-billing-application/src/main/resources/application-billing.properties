# Billing Platform Configuration
numou.billing.platform.enabled=true
numou.billing.platform.plugin-directory=billing/plugins

# Plugin Configuration
numou.billing.plugins.saas.enabled=true
numou.billing.plugins.digital.enabled=true
numou.billing.plugins.ecommerce.enabled=true
numou.billing.plugins.platform.enabled=true
numou.billing.plugins.services.enabled=true
numou.billing.plugins.custom.enabled=false

# Default Plugins by Product Type
numou.billing.default-plugin.SAAS_SUBSCRIPTION=saas-plugin-v1
numou.billing.default-plugin.DIGITAL_DOWNLOAD=digital-plugin-v1
numou.billing.default-plugin.PHYSICAL_GOODS=ecommerce-plugin-v1
numou.billing.default-plugin.PLATFORM_FEE=platform-plugin-v1

# Billing Cycles
numou.billing.cycles=MONTHLY,QUARTERLY,SEMI_ANNUAL,ANNUAL,BIENNIAL
numou.billing.default-cycle=MONTHLY

# Payment Gateway Selection
numou.billing.default-gateway=stripe
numou.billing.gateway.fallback=adyen

# Tax Configuration
numou.billing.tax.default=PPN
numou.billing.tax.rate=0.11
numou.billing.tax.rate-2025=0.12

# Notifications
numou.billing.notifications.enabled=true
numou.billing.notifications.channels=EMAIL,SMS,PUSH,WEBHOOK