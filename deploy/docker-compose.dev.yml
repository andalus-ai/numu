# Local stack: Postgres (non-superuser app role), Redpanda (Kafka API), OTel collector, Prometheus, Grafana, Tempo.
# Start the app separately: mvn -pl restaurant/restaurant-api quarkus:dev
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: syirkah, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    volumes: ["./postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro"]
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command: [redpanda, start, --overprovisioned, --smp, "1", --memory, 512M, --kafka-addr, "PLAINTEXT://0.0.0.0:9092", --advertise-kafka-addr, "PLAINTEXT://localhost:9092"]
    ports: ["9092:9092"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otel.yaml"]
    volumes: ["./observability/otel-collector.yaml:/etc/otel.yaml:ro"]
    ports: ["4317:4317"]
  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./observability/tempo.yaml:/etc/tempo.yaml:ro"]
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.2.0
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Admin }
    ports: ["3000:3000"]
