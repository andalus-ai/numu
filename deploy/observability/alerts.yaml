# Prometheus alert rules. Metric names follow Micrometer's Prometheus naming.
groups:
  - name: numou-restaurant-slo
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="numou-restaurant",status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{job="numou-restaurant"}[5m])) > 0.02
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "More than 2% of API requests fail with 5xx"
          runbook: "docs/PRODUCTION.md#runbook-high-error-rate"
      - alert: SlowRequests
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{job="numou-restaurant",uri!~"/q/.*"}[5m]))) > 1.5
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "p99 API latency above 1.5s for 10 minutes" }
      - alert: RateLimitingSpike
        expr: sum(rate(http_server_requests_seconds_count{job="numou-restaurant",status="429"}[5m])) > 5
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "Sustained 429s: a client is hammering the API or limits are too low" }

  - name: numou-outbox
    rules:
      - alert: OutboxLagging
        expr: max(outbox_oldest_pending_age_seconds{job="numou-restaurant"}) > 60
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Events have been waiting in the outbox for over a minute (kitchen tickets and order updates are delayed)"
          runbook: "docs/PRODUCTION.md#runbook-outbox-lag"
      - alert: OutboxDeadLetters
        expr: max(outbox_dead_letters{job="numou-restaurant"}) > 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "Outbox entries exhausted their retries"
          runbook: "docs/PRODUCTION.md#runbook-outbox-dead-letters"
      - alert: OutboxMetricsMissing
        expr: absent(outbox_pending{job="numou-restaurant"})
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "Outbox gauges are not being scraped: the lag alert above cannot fire" }

  - name: numou-business
    rules:
      - alert: NoShowSpike
        expr: sum(increase(domain_events_published_total{type="restaurant.reservation.no-show"}[1h])) > 10
        labels: { severity: info }
        annotations: { summary: "Unusual number of no-shows in the last hour" }
      - alert: KitchenSilentDuringService
        # orders are being fired but nothing is bumped: the KDS may be down or the consumer is stuck
        expr: |
          sum(increase(domain_events_published_total{type="restaurant.order.course-fired"}[15m])) > 5
            and sum(increase(domain_events_published_total{type="restaurant.kitchen.ticket.bumped"}[15m])) == 0
        for: 10m
        labels: { severity: page }
        annotations: { summary: "Courses are being fired but no tickets are being bumped" }

  - name: numou-platform
    rules:
      - alert: PodRestarting
        expr: increase(kube_pod_container_status_restarts_total{container="app",pod=~"numou-restaurant-.*"}[15m]) > 2
        labels: { severity: ticket }
        annotations: { summary: "numou-restaurant pod restarting repeatedly" }
