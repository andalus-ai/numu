name: Reliability PostgreSQL integration

on:
  pull_request:
    paths:
      - "core/framework/reliability/**"
      - "core/framework/pom.xml"
      - ".github/workflows/reliability-postgres-integration.yml"
  push:
    branches: [main]
    paths:
      - "core/framework/reliability/**"
      - "core/framework/pom.xml"
      - ".github/workflows/reliability-postgres-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability-postgres:
    name: Reliability PostgreSQL lease and migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify reliability reactor against PostgreSQL
        run: mvn -B -ntp -f core/framework/pom.xml -pl reliability/reliability-adapter -am test

      - name: Upload reliability test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-postgres-test-reports
          path: |
            core/framework/reliability/**/target/surefire-reports/*.txt
            core/framework/reliability/**/target/surefire-reports/*.xml
          if-no-files-found: warn
