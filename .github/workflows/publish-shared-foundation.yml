name: Publish Shared Maven Parent and Foundation

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-shared-foundation
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 and GitHub Packages credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Verify and publish shared artifacts
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B -ntp
          -f core/framework/pom.xml
          -pl parent,bom,foundation
          -am
          deploy
