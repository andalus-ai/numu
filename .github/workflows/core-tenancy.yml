name: Core Tenancy Reactor Verification

on:
  pull_request:
    paths:
      - "core/framework/**"
      - "tenancy/**"
      - ".github/workflows/core-tenancy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-tenancy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tenancy:
    name: Core Foundation and Tenancy reactor
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate Core framework parent and aggregator
        run: mvn -B -ntp -N -f core/framework/pom.xml validate

      - name: Verify Core Foundation and Tenancy dependency closure
        run: mvn -B -ntp -f core/framework/pom.xml -pl ../../tenancy -am verify

      - name: Validate shared platform BOM
        run: mvn -B -ntp -f core/framework/bom/pom.xml validate
