name: Feedback PostgreSQL CI

on:
  pull_request:
    branches: [main]
    paths:
      - "feedback/**"
      - "core/framework/**"
      - ".github/workflows/feedback-postgres.yml"
  push:
    branches: [main]
    paths:
      - "feedback/**"
      - "core/framework/**"
      - ".github/workflows/feedback-postgres.yml"

permissions:
  contents: read

concurrency:
  group: feedback-postgres-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feedback-postgres:
    name: Feedback Maven and PostgreSQL integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate capability reactor parent paths
        run: python3 tools/verify-module-topology.py
      - name: Install framework parent POM
        run: mvn -B -ntp -N -f core/framework/pom.xml install
      - name: Build and install foundation contracts
        run: mvn -B -ntp -f core/framework/foundation/pom.xml install
      - name: Verify Feedback domain, application and PostgreSQL adapter
        run: mvn -B -ntp -f feedback/pom.xml verify
      - name: Upload Feedback Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feedback-postgres-test-reports
          path: "feedback/**/target/surefire-reports/**"
          if-no-files-found: warn
          retention-days: 7
