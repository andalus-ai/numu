name: CRM PostgreSQL tenant integrity

on:
  pull_request:
    paths:
      - "crm/**"
      - ".github/workflows/crm-postgres.yml"
  push:
    branches: [main]
    paths:
      - "crm/**"
      - ".github/workflows/crm-postgres.yml"

permissions:
  contents: read

jobs:
  crm-tenant-relationship-integrity:
    name: CRM migrations and tenant relationship constraints
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: numou_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d numou_crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply CRM schema migrations in version order
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            echo "Applying ${migration}"
            psql -h localhost -U postgres -d numou_crm_test -v ON_ERROR_STOP=1 -f "${migration}"
          done < <(find crm/numou-crm-adapter/src/main/resources/db/migration -maxdepth 1 -type f -name 'V*.sql' | sort -V)
      - name: Verify tenant-local relationship constraints
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d numou_crm_test -v ON_ERROR_STOP=1 \
            -f crm/numou-crm-adapter/src/test/resources/db/tenant-relationship-integrity.sql
      - name: Verify legacy ownership inventory is read-only and executable
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d numou_crm_test -v ON_ERROR_STOP=1 \
            -c "BEGIN READ ONLY" \
            -f crm/docs/operations/legacy-tenant-ownership-inventory.sql \
            -c "ROLLBACK"
      - name: Verify evidence-backed ownership proposal lifecycle
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d numou_crm_test -v ON_ERROR_STOP=1 \
            -f crm/numou-crm-adapter/src/test/resources/db/tenant-ownership-proposals.sql
