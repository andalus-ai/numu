name: Hospitality capability

on:
  push:
    branches: [main]
    paths:
      - "hospitality/**"
      - ".github/workflows/hospitality-capability.yml"
      - "tools/verify-module-topology.py"
      - "tools/verify-domain-boundaries.py"
      - "core/framework/pom.xml"
  pull_request:
    paths:
      - "hospitality/**"
      - ".github/workflows/hospitality-capability.yml"
      - "tools/verify-module-topology.py"
      - "tools/verify-domain-boundaries.py"
      - "core/framework/pom.xml"

permissions:
  contents: read

jobs:
  hospitality:
    name: Hospitality domain, application and PostgreSQL verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate capability reactor parent paths
        run: python3 tools/verify-module-topology.py
      - name: Enforce domain dependency boundaries
        run: python3 tools/verify-domain-boundaries.py
      - name: Install framework parent POM
        run: mvn -B -ntp -N -f core/framework/pom.xml install
      - name: Verify Hospitality capability reactor
        run: mvn -B -ntp -f hospitality/pom.xml verify
      - name: Upload Hospitality Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hospitality-maven-test-reports
          path: "hospitality/**/target/surefire-reports/**"
          if-no-files-found: warn
          retention-days: 7
