name: Transport Domain CI

on:
  pull_request:
    paths:
      - "transport/**"
      - ".github/workflows/transport-domain.yml"
      - "core/framework/pom.xml"
  push:
    branches: [main]
    paths:
      - "transport/**"
      - ".github/workflows/transport-domain.yml"
      - "core/framework/pom.xml"

permissions:
  contents: read

jobs:
  transport-domain:
    name: Transport domain tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install framework parent POM
        run: mvn -B -ntp -N -f core/framework/pom.xml install
      - name: Verify transport capability reactor
        run: mvn -B -ntp -f transport/pom.xml verify
