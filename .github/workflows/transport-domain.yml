name: Transport Domain CI

on:
  pull_request:
    paths:
      - "transport/**"
      - ".github/workflows/transport-domain.yml"
      - "core/framework/pom.xml"
  push:
    branches: [main]
    paths:
      - "transport/**"
      - ".github/workflows/transport-domain.yml"
      - "core/framework/pom.xml"

permissions:
  contents: read

jobs:
  transport-domain:
    name: Transport domain tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install framework parent POM
        run: mvn -B -ntp -N -f core/framework/pom.xml install
      - name: Build and install foundation capabilities
        run: mvn -B -ntp -f core/framework/foundation/pom.xml install
      - name: Verify and install Geo capability
        run: mvn -B -ntp -f geo/pom.xml install
      - name: Build and install cache contracts used by security
        run: mvn -B -ntp -f core/framework/cache/pom.xml install
      - name: Build and install observability contracts used by security
        run: mvn -B -ntp -f core/framework/observability/pom.xml -pl observability-api,observability-application -am install
      - name: Build and install public security contracts used by Transport
        run: mvn -B -ntp -f security/pom.xml -pl security-spi -am install
      - name: Verify transport capability reactor
        run: mvn -B -ntp -f transport/pom.xml verify
