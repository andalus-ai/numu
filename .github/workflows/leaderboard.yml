name: Leaderboard Capability CI

on:
  pull_request:
    branches: [main]
    paths:
      - "core/framework/leaderboard/**"
      - "core/framework/foundation/**"
      - "core/framework/pom.xml"
      - "core/framework/bom/pom.xml"
      - "tools/verify-module-topology.py"
      - ".github/workflows/leaderboard.yml"

permissions:
  contents: read

concurrency:
  group: leaderboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leaderboard-domain:
    name: Leaderboard domain Maven and architecture verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate capability reactor parent paths
        run: python3 tools/verify-module-topology.py
      - name: Install shared framework parent POM
        run: mvn -B -ntp -N -f core/framework/parent/pom.xml install
      - name: Install framework aggregator POM
        run: mvn -B -ntp -N -f core/framework/pom.xml install
      - name: Install Foundation domain contracts
        run: mvn -B -ntp -f core/framework/foundation/pom.xml -pl numou-foundation-domain -am install
      - name: Verify Leaderboard domain and architecture tests
        run: mvn -B -ntp -f core/framework/leaderboard/pom.xml verify
      - name: Upload Leaderboard Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-domain-test-reports
          path: "core/framework/leaderboard/**/target/surefire-reports/**"
          if-no-files-found: warn
          retention-days: 7
