name: Notification capability

on:
  push:
    branches: [main]
    paths:
      - "notification/**"
      - ".github/workflows/notification-capability.yml"
      - "tools/verify-module-topology.py"
      - "tools/verify-domain-boundaries.py"
  pull_request:
    paths:
      - "notification/**"
      - ".github/workflows/notification-capability.yml"
      - "tools/verify-module-topology.py"
      - "tools/verify-domain-boundaries.py"

permissions:
  contents: read

jobs:
  notification:
    name: Notification domain and application verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate capability reactor parent paths
        run: python3 tools/verify-module-topology.py
      - name: Enforce domain dependency boundaries
        run: python3 tools/verify-domain-boundaries.py
      - name: Install framework parent POM
        run: mvn -B -ntp -N -f core/framework/pom.xml install
      - name: Install foundation capabilities required by Numou security integration
        run: mvn -B -ntp -f core/framework/foundation/pom.xml install
      - name: Install cache contracts required by Numou security integration
        run: mvn -B -ntp -f core/framework/cache/pom.xml install
      - name: Install observability contracts required by Numou security integration
        run: mvn -B -ntp -f core/framework/observability/pom.xml -pl observability-api,observability-application -am install
      - name: Install Numou security reactor required by Notification integration
        run: mvn -B -ntp -f security/pom.xml install
      - name: Verify notification domain, application, and host adapters
        run: mvn -B -ntp -f notification/pom.xml verify
      - name: Upload notification Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-maven-test-reports
          path: "notification/**/target/surefire-reports/**"
          if-no-files-found: warn
          retention-days: 7
