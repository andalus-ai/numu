name: Shared Maven Parent Validation

on:
  pull_request:
    paths:
      - "core/framework/**"
      - ".github/workflows/shared-maven-parent-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-maven-parent-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate standalone shared parent
        run: mvn -B -ntp -f core/framework/parent/pom.xml verify

      - name: Validate framework aggregator model without unrelated child reactors
        run: mvn -B -ntp -N -f core/framework/pom.xml validate

      - name: Validate published platform BOM
        run: mvn -B -ntp -f core/framework/bom/pom.xml verify

      - name: Validate Foundation reactor
        run: mvn -B -ntp -f core/framework/foundation/pom.xml verify
