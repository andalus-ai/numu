name: Numou CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: numou-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module-topology:
    name: Module topology and parent resolution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate capability reactor parent paths
        run: python3 tools/verify-module-topology.py
      - name: Test domain dependency boundary verifier
        run: python3 tools/test-verify-domain-boundaries.py
      - name: Enforce domain dependency boundaries
        run: python3 tools/verify-domain-boundaries.py
      - name: Test capability dependency-direction verifier
        run: python3 tools/test-verify-capability-boundaries.py
      - name: Enforce declared capability dependency directions
        run: python3 tools/verify-capability-boundaries.py

  queue-management-postgres:
    name: Queue Management PostgreSQL runtime verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate capability reactor parent paths
        run: python3 tools/verify-module-topology.py
      - name: Install framework parent POM
        run: mvn -B -ntp -N -f core/framework/pom.xml install
      - name: Build and install foundation capabilities
        run: mvn -B -ntp -f core/framework/foundation/pom.xml install
      - name: Verify Queue Management domain and PostgreSQL runtime
        run: mvn -B -ntp -f queue-management/pom.xml verify
      - name: Upload Queue Management Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-management-postgres-test-reports
          path: "queue-management/**/target/surefire-reports/**"
          if-no-files-found: warn
          retention-days: 7

  wallet-postgres-integration:
    name: Wallet PostgreSQL integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: numou
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d numou"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install framework parent POM
        run: mvn -B -ntp -N -f core/framework/pom.xml install
      - name: Build and install foundation capabilities
        run: mvn -B -ntp -f core/framework/foundation/pom.xml install
      - name: Verify and install Geo capability
        run: mvn -B -ntp -f geo/pom.xml install
      - name: Build and install cache contracts
        run: mvn -B -ntp -f core/framework/cache/pom.xml install
      - name: Build and install observability contracts
        run: mvn -B -ntp -f core/framework/observability/pom.xml -pl observability-api,observability-application -am install
      - name: Build and install security capability
        run: mvn -B -ntp -f security/pom.xml install
      - name: Build and install framework reactor
        run: mvn -B -ntp -f core/framework/pom.xml install
      - name: Build and install shared wallet capability artifacts
        run: >-
          mvn -B -ntp -f finance/pom.xml
          -pl wallet/numou-wallet-domain,wallet/numou-wallet-spi,wallet/numou-wallet-application,wallet/numou-wallet-adapter,wallet/numou-wallet-postgres-adapter
          -am install
      - name: Run Mobility and neutral wallet PostgreSQL integration tests
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: numou_mobility_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_SSLMODE: disable
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres numou_mobility_test
          mvn -B -ntp -f mobility/pom.xml -Ppg-integration verify
      - name: Upload wallet PostgreSQL test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-postgres-integration-reports
          path: "mobility/**/target/surefire-reports/**"
          if-no-files-found: warn
          retention-days: 7

  framework-and-logistics:
    name: Framework and Courier/Cargo verification
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: numou
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d numou"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rustfs:
        image: rustfs/rustfs:1.0.3
        env:
          RUSTFS_ACCESS_KEY: numou-ci-access
          RUSTFS_SECRET_KEY: numou-ci-secret
          RUSTFS_ADDRESS: ":9000"
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_CHECK_UPDATE: "false"
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate capability reactor parent paths
        run: python3 tools/verify-module-topology.py
      # Install the parent POM before independent reactors install artifacts whose
      # published POMs inherit from numou-framework. A child reactor resolving its
      # parent through relativePath does not install that parent into the local repo.
      - name: Install framework parent POM
        run: mvn -B -ntp -N -f core/framework/pom.xml install
      - name: Build and install foundation capabilities
        run: mvn -B -ntp -f core/framework/foundation/pom.xml install
      # Install cross-reactor capability contracts before consumers that depend on them.
      - name: Verify and install Geo capability
        run: mvn -B -ntp -f geo/pom.xml install
      # Security consumes cache contracts and observability API/application artifacts
      # from separate framework reactors. Install these before building the security reactor.
      - name: Build and install cache contracts used by security
        run: mvn -B -ntp -f core/framework/cache/pom.xml install
      - name: Build and install observability contracts used by security
        run: mvn -B -ntp -f core/framework/observability/pom.xml -pl observability-api,observability-application -am install
      - name: Build and install security contracts used by framework adapters
        run: mvn -B -ntp -f security/pom.xml install
      - name: Build and install framework reactor
        run: mvn -B -ntp -f core/framework/pom.xml install
      - name: Verify Queue Management domain reactor
        run: mvn -B -ntp -f queue-management/pom.xml verify
      - name: Build and install canonical product domain for automotive parts
        run: mvn -B -ntp -f product/pom.xml -pl product-domain -am install
      # Automotive-parts inventory integration consumes the inventory application contract
      # from the independent supply reactor; install the minimal dependency closure first.
      - name: Build and install inventory contracts for automotive-parts integration
        run: mvn -B -ntp -f supply/pom.xml -pl inventory/inventory-application,inventory/inventory-adapter -am install -DskipTests
      - name: Verify automotive parts domain reactor
        run: mvn -B -ntp -f automotive-parts/pom.xml verify
      - name: Wait for RustFS readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:9000/health >/dev/null; then
              echo "RustFS is ready"
              exit 0
            fi
            sleep 2
          done
          echo "RustFS did not become ready in time" >&2
          exit 1
      - name: Verify document storage reactor
        env:
          NUMOU_RUSTFS_ENDPOINT: http://localhost:9000
          NUMOU_RUSTFS_ACCESS_KEY: numou-ci-access
          NUMOU_RUSTFS_SECRET_KEY: numou-ci-secret
          NUMOU_RUSTFS_BUCKET: numou-document-integration
        run: mvn -B -ntp -f documents/pom.xml verify
      - name: Build and install full security reactor
        run: mvn -B -ntp -f security/pom.xml install
      # Wallet PostgreSQL integration is isolated in its own job so failures in unrelated
      # capabilities cannot prevent this verification from running.
      # Install identity artifacts without running identity tests here. This
      # bootstrap is a prerequisite for downstream reactors, not the identity
      # verification gate; an identity test failure must not hide Courier results.
      - name: Build and install identity contracts (tests deferred)
        id: identity_bootstrap
        run: mvn -B -ntp -f identity/pom.xml install -DskipTests
      - name: Build and install organization contracts used by Courier
        run: mvn -B -ntp -f organization/pom.xml install
      - name: Build and install quantity contracts
        run: mvn -B -ntp -f quantity/pom.xml install
      - name: Install supply parent POM for cross-reactor consumers
        run: mvn -B -ntp -N -f supply/pom.xml install
      - name: Verify and install purchasing contracts for integration consumers
        run: mvn -B -ntp -f supply/purchasing/pom.xml install
      - name: Verify workshop parts purchasing integration
        run: mvn -B -ntp -f automotive-parts-purchasing/pom.xml verify
      - name: Verify supply-chain reactor
        id: supply_verify
        # Supply and Courier are separate capability reactors. Preserve a supply
        # failure but continue so Courier's independent integration tests still run.
        continue-on-error: true
        run: mvn -B -ntp -f supply/pom.xml verify
      - name: Verify Courier/Cargo reactor
        run: mvn -B -ntp -f logistics/pom.xml verify
      # Run identity's own tests after downstream capability verification. Keep
      # the result visible but do not let one independent capability suppress
      # another capability's test reports.
      - name: Verify identity reactor independently
        id: identity_verify
        continue-on-error: true
        run: mvn -B -ntp -f identity/pom.xml verify
      # Fail only after independent capability verification has had its chance.
      - name: Propagate isolated capability verification failures
        if: always() && (steps.identity_verify.outcome == 'failure' || steps.supply_verify.outcome == 'failure')
        run: |
          if [ "${{ steps.identity_verify.outcome }}" = "failure" ]; then
            echo "::error::Identity reactor verification failed; see the identity verification step above."
          fi
          if [ "${{ steps.supply_verify.outcome }}" = "failure" ]; then
            echo "::error::Supply-chain reactor verification failed; see the supply-chain step above."
          fi
          exit 1
      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: "**/target/surefire-reports/**"
          if-no-files-found: warn
          retention-days: 7

  syirkah:
    name: Syirkah ledger verification
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: numou
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d numou"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install framework parent POM
        run: mvn -B -ntp -N -f core/framework/pom.xml install
      - name: Build and install foundation capabilities
        run: mvn -B -ntp -f core/framework/foundation/pom.xml install
      # The PostgreSQL integration test must run as a role that is neither a
      # superuser nor BYPASSRLS, otherwise row-level security is not exercised.
      - name: Create a non-superuser role for the RLS integration test
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d numou -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE syirkah_app LOGIN PASSWORD 'syirkah_app' NOSUPERUSER NOBYPASSRLS;
          GRANT ALL ON SCHEMA public TO syirkah_app;
          SQL
      # Upstream finance modules are compiled and installed without running their
      # tests: this job verifies syirkah. Their own tests belong to their own job.
      - name: Install modules that syirkah depends on (no tests)
        run: |
          set -o pipefail
          mvn -B -ntp -f finance/pom.xml -pl syirkah/numou-syirkah-rest -am install -Dmaven.test.skip=true 2>&1 | tee syirkah-deps.log || {
            grep -E "ERROR|BUILD|Reactor Summary|FAIL" syirkah-deps.log | head -12 | while read -r line; do echo "::error::${line:0:400}"; done
            exit 1
          }
      - name: Verify syirkah modules
        env:
          SYIRKAH_PG_URL: jdbc:postgresql://localhost:5432/numou
          SYIRKAH_PG_USER: syirkah_app
          SYIRKAH_PG_PASSWORD: syirkah_app
        run: |
          set -o pipefail
          mvn -B -ntp -f finance/syirkah/pom.xml verify 2>&1 | tee syirkah-mvn.log || {
            grep -E "ERROR|BUILD|Reactor Summary|FAIL" syirkah-mvn.log | head -12 | while read -r line; do echo "::error::${line:0:400}"; done
            exit 1
          }
      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syirkah-test-reports
          path: "finance/**/target/surefire-reports/**"
          if-no-files-found: warn
          retention-days: 7


  affiliate:
