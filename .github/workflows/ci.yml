    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install framework parent POM
        run: mvn -B -ntp -N -f core/framework/pom.xml install
      - name: Verify affiliate domain, SPI, and application contracts
        run: mvn -B -ntp -f commerce/affiliate/pom.xml verify
      - name: Upload affiliate Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-maven-test-reports
          path: "commerce/affiliate/**/target/surefire-reports/**"
          if-no-files-found: warn
          retention-days: 7

  marketplace:
    name: Marketplace order and checkout verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install framework parent POM
        run: mvn -B -ntp -N -f core/framework/pom.xml install
      - name: Install finance parent POMs for payment API contract
        run: |
          mvn -B -ntp -N -f finance/pom.xml install
          mvn -B -ntp -N -f finance/payment/pom.xml install
      - name: Install public payment API contract
        run: mvn -B -ntp -f finance/payment/numou-payment-api/pom.xml install
      - name: Verify marketplace domain, application, PostgreSQL persistence, and checkout saga
        run: mvn -B -ntp -f commerce/marketplace/pom.xml verify
      - name: Upload marketplace Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-maven-test-reports
          path: "commerce/marketplace/**/target/surefire-reports/**"
          if-no-files-found: warn
          retention-days: 7


  workforce:
    name: Workforce domain, application, SPI and adapter verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install framework parent POM
        run: mvn -B -ntp -N -f core/framework/pom.xml install
      - name: Build and install foundation capabilities
        run: mvn -B -ntp -f core/framework/foundation/pom.xml install
      - name: Verify Workforce reactor
        run: mvn -B -ntp -f workforce/pom.xml verify
      - name: Upload Workforce Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workforce-maven-test-reports
          path: "workforce/**/target/surefire-reports/**"
          if-no-files-found: warn
          retention-days: 7


  support:
    name: Support authenticated actor and persistence verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install framework parent POM
        run: mvn -B -ntp -N -f core/framework/pom.xml install
      - name: Build and install foundation capabilities
        run: mvn -B -ntp -f core/framework/foundation/pom.xml install
      - name: Build and install cache contracts
        run: mvn -B -ntp -f core/framework/cache/pom.xml install
      - name: Build and install observability contracts
        run: mvn -B -ntp -f core/framework/observability/pom.xml -pl observability-api,observability-application -am install
      - name: Build and install security capability
        run: mvn -B -ntp -f security/pom.xml install
      - name: Build and install framework reactor
        run: mvn -B -ntp -f core/framework/pom.xml install
      - name: Build and install Identity adapter contracts
        run: mvn -B -ntp -f identity/pom.xml install -DskipTests
      - name: Verify Support application, API, and trusted actor adapter
        run: mvn -B -ntp -f support/pom.xml verify
      - name: Upload Support and Ecosystem test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: support-ecosystem-maven-test-reports
          path: |
            support/**/target/surefire-reports/**
            core/framework/ecosystem/**/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 7

  workspace:
    name: Workspace capability verification
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: numou_workspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d numou_workspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install framework parent POM
        run: mvn -B -ntp -N -f core/framework/pom.xml install
      - name: Build and install foundation capabilities
        run: mvn -B -ntp -f core/framework/foundation/pom.xml install
      - name: Verify and install Geo capability
        run: mvn -B -ntp -f geo/pom.xml install
      - name: Build and install cache contracts used by security
        run: mvn -B -ntp -f core/framework/cache/pom.xml install
      - name: Build and install observability contracts used by security
        run: mvn -B -ntp -f core/framework/observability/pom.xml -pl observability-api,observability-application -am install
      - name: Build and install security contracts used by framework adapters
        run: mvn -B -ntp -f security/pom.xml install
      - name: Build and install framework reactor
        run: mvn -B -ntp -f core/framework/pom.xml install
      - name: Verify workspace domain, application, persistence, and REST adapter
        env:
          NUMOU_WORKSPACE_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/numou_workspace
          NUMOU_WORKSPACE_TEST_DB_USER: postgres
          NUMOU_WORKSPACE_TEST_DB_PASSWORD: postgres
        run: mvn -B -ntp -f workspace/pom.xml verify
      - name: Upload workspace Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-maven-test-reports
          path: "workspace/**/target/surefire-reports/**"
          if-no-files-found: warn
          retention-days: 7

  hospitality:
    name: Hospitality capability verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate capability reactor parent paths
        run: python3 tools/verify-module-topology.py
      - name: Enforce domain dependency boundaries
        run: python3 tools/verify-domain-boundaries.py
      - name: Install framework parent POM
        run: mvn -B -ntp -N -f core/framework/pom.xml install
      - name: Verify Hospitality capability reactor
        run: mvn -B -ntp -f hospitality/pom.xml verify
      - name: Upload Hospitality Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hospitality-maven-test-reports
          path: "hospitality/**/target/surefire-reports/**"
          if-no-files-found: warn
          retention-days: 7
