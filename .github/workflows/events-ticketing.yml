name: Events and Ticketing CI

on:
  pull_request:
    paths:
      - "events/**"
      - "docs/capabilities/events-ticketing/**"
      - ".github/workflows/events-ticketing.yml"
      - "core/framework/pom.xml"
  push:
    branches: [main]
    paths:
      - "events/**"
      - "docs/capabilities/events-ticketing/**"
      - ".github/workflows/events-ticketing.yml"
      - "core/framework/pom.xml"

permissions:
  contents: read

jobs:
  events-ticketing:
    name: Events booking and PostgreSQL integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install framework parent POM
        run: mvn -B -ntp -N -f core/framework/pom.xml install
      - name: Verify events and ticketing capability reactor
        run: mvn -B -ntp -f events/pom.xml verify
