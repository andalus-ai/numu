name: Application Platform Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "application-platform/**"
      - "core/framework/plugin/**"
      - "core/framework/pom.xml"
      - "core/framework/foundation/**"
      - ".github/workflows/application-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework-plugin:
    name: Framework plugin manifest and resolver tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify manifest validator and capability resolver
        run: mvn -B -ntp -f core/framework/pom.xml -pl plugin -am test

  tenant-installation:
    name: Tenant application installation domain and application tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and install foundation domain dependencies
        run: mvn -B -ntp -f core/framework/foundation/pom.xml -pl numou-foundation-domain -am install -DskipTests
      - name: Build and install manifest validator and resolver contract
        run: mvn -B -ntp -f core/framework/pom.xml -pl plugin -am install -DskipTests
      - name: Verify application installation lifecycle
        run: mvn -B -ntp -f application-platform/pom.xml -pl application-platform-application -am test
