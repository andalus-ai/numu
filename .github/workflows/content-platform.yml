name: Content Platform Verification

on:
  push:
    branches: [content/m4-media-management]
    paths:
      - "content/**"
      - "document/**"
      - "core/framework/**"
      - ".github/workflows/content-platform.yml"
  pull_request:
    branches: [main, content/m1-content-core, content/m3-content-lifecycle]
    paths:
      - "content/**"
      - "core/framework/pom.xml"
      - "core/framework/parent/**"
      - ".github/workflows/content-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content:
    name: Content domain, application and PostgreSQL adapter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install framework parent POM
        run: mvn -B -ntp -N -f core/framework/pom.xml install
      - name: Install Foundation dependencies
        run: mvn -B -ntp -f core/framework/foundation/pom.xml install
      - name: Install Document domain and application dependencies
        run: mvn -B -ntp -f document/pom.xml -pl numou-document-application -am install
      - name: Verify Content capability
        run: mvn -B -ntp -f content/pom.xml verify
      - name: Upload Content Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-platform-maven-test-reports
          path: "content/**/target/surefire-reports/**"
          if-no-files-found: warn
          retention-days: 7
