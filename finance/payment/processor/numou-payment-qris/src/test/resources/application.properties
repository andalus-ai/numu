quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.devservices.enabled=false

# Payment gateway configs
payment.gateway.midtrans.merchant-id=MOCK-MERCHANT-01
payment.gateway.midtrans.server-key=SB-Mid-server-TEST_KEY
payment.gateway.midtrans.client-key=SB-Mid-client-TEST_KEY
payment.gateway.midtrans.environment=SANDBOX
payment.gateway.midtrans.base-url=https://api.sandbox.midtrans.com
quarkus.rest-client.midtrans.url=https://api.sandbox.midtrans.com

payment.gateway.xendit.secret-key=xnd_development_TEST_KEY
