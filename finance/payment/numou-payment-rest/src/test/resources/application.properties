# Test Configuration for Ky Payment Core
# This configuration is used for running tests

# ===========================================
# DATABASE CONFIGURATION (H2 for tests)
# ===========================================
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# ===========================================
# HIBERNATE ORM CONFIGURATION
# ===========================================
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.format-sql=true

# ===========================================
# PAYMENT GATEWAY CONFIGURATION (Mock/Test)
# ===========================================

# Midtrans Test Configuration
payment.gateway.midtrans.merchant-id=MOCK-MERCHANT-01
payment.gateway.midtrans.server-key=SB-Mid-server-TEST_KEY
payment.gateway.midtrans.client-key=SB-Mid-client-TEST_KEY
payment.gateway.midtrans.environment=SANDBOX
payment.gateway.midtrans.base-url=https://api.sandbox.midtrans.com

# Xendit Test Configuration
payment.gateway.xendit.secret-key=xnd_development_TEST_KEY
payment.gateway.xendit.public-key=xnd_public_development_TEST_KEY
payment.gateway.xendit.environment=SANDBOX
payment.gateway.xendit.base-url=https://api.xendit.co

# ===========================================
# DEFAULT PAYMENT SETTINGS
# ===========================================
payment.default.gateway=MIDTRANS
payment.currency=IDR
payment.expiry.minutes=1440

# ===========================================
# LOGGING CONFIGURATION
# ===========================================
quarkus.log.level=INFO
quarkus.log.category."tech.kayys.payment".level=DEBUG
quarkus.log.category."io.quarkus".level=INFO

# ===========================================
# HTTP CONFIGURATION
# ===========================================
quarkus.http.test-port=8081
quarkus.http.test-ssl-port=8444

# ===========================================
# REST CLIENT CONFIGURATION
# ===========================================
# Disable actual REST client calls in tests
# Mock responses will be used instead
# Rest client base URLs
quarkus.rest-client.midtrans.url=https://api.sandbox.midtrans.com
quarkus.rest-client.xendit.url=https://api.xendit.co
