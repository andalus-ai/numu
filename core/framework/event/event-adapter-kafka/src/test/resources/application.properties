quarkus.kafka.devservices.enabled=false
mp.messaging.incoming.numou-events-in.connector=smallrye-kafka
mp.messaging.incoming.numou-events-in.topic=numou\\.events\\.pos\\..+
mp.messaging.incoming.numou-events-in.pattern=true
mp.messaging.incoming.numou-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.numou-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.numou-events-in.group.id=numou-event-consumer-connector-test
mp.messaging.incoming.numou-events-in.enable.auto.commit=false
mp.messaging.incoming.numou-events-in.auto.offset.reset=earliest
mp.messaging.incoming.numou-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.numou-events-in.dead-letter-queue.topic=numou.events.dead-letter
mp.messaging.incoming.numou-events-in.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.numou-events-in.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# A second independent application consumer group proves that the same source
# record is delivered to each group rather than load-balanced across groups.
mp.messaging.incoming.numou-events-observer.connector=smallrye-kafka
mp.messaging.incoming.numou-events-observer.topic=numou\\.events\\.pos\\..+
mp.messaging.incoming.numou-events-observer.pattern=true
mp.messaging.incoming.numou-events-observer.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.numou-events-observer.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.numou-events-observer.group.id=numou-event-observer-acceptance-test
mp.messaging.incoming.numou-events-observer.enable.auto.commit=false
mp.messaging.incoming.numou-events-observer.auto.offset.reset=earliest
