quarkus.application.name=survey-platform
quarkus.http.port=8080

# Operator key for /api/v1/admin/** (override with SURVEY_ADMIN_KEY)
survey.admin-key=${SURVEY_ADMIN_KEY:dev-admin-key}
survey.seed-demo-tenant=true

# The REST adapter lives in a separate module: tell ArC/RESTEasy to index it.
quarkus.index-dependency.rest.group-id=io.surveyhub
quarkus.index-dependency.rest.artifact-id=survey-adapter-rest
