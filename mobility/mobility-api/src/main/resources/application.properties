# =============================================================================
# Numou ride-hailing service. Same operational conventions as the restaurant service (see restaurant-api application.properties):
# everything environment-specific is an environment variable; no secrets in this file.
# =============================================================================
quarkus.application.name=numou-mobility

quarkus.http.port=8080
quarkus.http.limits.max-body-size=256K
quarkus.http.limits.max-header-size=16K
quarkus.http.read-timeout=30s
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.cors.origins=${CORS_ORIGINS:https://app.example.com}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Idempotency-Key,X-Correlation-ID,X-Tenant-Id
quarkus.http.cors.exposed-headers=X-Correlation-ID,X-Request-Id,Retry-After

quarkus.management.enabled=true
quarkus.management.port=9000
quarkus.micrometer.export.prometheus.enabled=true

quarkus.index-dependency.persistence.group-id=tech.kayys.numou
quarkus.index-dependency.persistence.artifact-id=numou-mobility-persistence
quarkus.index-dependency.aggregate.group-id=tech.kayys.numou
quarkus.index-dependency.aggregate.artifact-id=numou-aggregate-persistence

# ---- Authentication ----------------------------------------------------------------
quarkus.oidc.auth-server-url=${OIDC_ISSUER_URL}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:numou-mobility}
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=${OIDC_AUDIENCE:numou-mobility}
quarkus.oidc.token.issuer=${OIDC_ISSUER_URL}
quarkus.oidc.roles.role-claim-path=groups
# Share links and provider callbacks need no login (callbacks authenticate by signature; both are rate-limited per IP).
quarkus.http.auth.permission.public.paths=/api/v1/public/*,/api/v1/webhooks/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
numou.security.tenant-claim=numou_tenant_id
numou.security.tenants-claim=numou_tenants
numou.security.user-id-claim=numou_user_id
numou.security.trust-forwarded-for=${TRUST_FORWARDED_FOR:true}
numou.ratelimit.enabled=true
# Drivers send a GPS fix every ~4 s (0.25/s) plus actions; riders poll/stream. 20/s sustained with a burst of 60 per principal is generous.
numou.ratelimit.capacity=${RATELIMIT_BURST:60}
numou.ratelimit.refill-per-second=${RATELIMIT_RATE:20}

# ---- Database ----------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}
quarkus.datasource.reactive.url=postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
quarkus.datasource.reactive.postgresql.ssl-mode=${DB_SSLMODE:require}
# Location updates are frequent and tiny: size the pool for concurrency, not throughput.
quarkus.datasource.reactive.max-size=${DB_POOL_MAX:30}
quarkus.datasource.reactive.connection-timeout=PT5S
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# ---- Messaging ------------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP:localhost:9092}
mp.messaging.outgoing.domain-events.connector=smallrye-kafka
mp.messaging.outgoing.domain-events.topic=${EVENTS_TOPIC:numou.domain-events}
mp.messaging.outgoing.domain-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.domain-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.domain-events.acks=all
mp.messaging.outgoing.domain-events.enable.idempotence=true
mp.messaging.outgoing.domain-events.waitForWriteCompletion=true
mp.messaging.incoming.mobility-events.connector=smallrye-kafka
mp.messaging.incoming.mobility-events.topic=${EVENTS_TOPIC:numou.domain-events}
mp.messaging.incoming.mobility-events.group.id=mobility-settlement
mp.messaging.incoming.mobility-events.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.mobility-events.auto.offset.reset=earliest
mp.messaging.incoming.mobility-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.mobility-events.dead-letter-queue.topic=${EVENTS_TOPIC:numou.domain-events}.dlq
numou.outbox.relay-interval=1s
numou.outbox.batch-size=50

# ---- Mobility ----------------------------------------------------------------------------
# Base64 of at least 32 random bytes:  head -c 48 /dev/urandom | base64
numou.mobility.secret=${MOBILITY_SECRET}
# Separate PIN secret (recommended): rotating the quote secret then never affects rides in progress.
numou.mobility.pin-secret=${MOBILITY_PIN_SECRET:}
numou.mobility.area.name=${SERVICE_AREA_NAME:Jakarta}
numou.mobility.area.lat=${SERVICE_AREA_LAT:-6.2088}
numou.mobility.area.lng=${SERVICE_AREA_LNG:106.8456}
numou.mobility.area.radius-meters=${SERVICE_AREA_RADIUS_M:40000}
numou.mobility.commission=${COMMISSION_RATE:0.20}
numou.mobility.driver-cash-debt-limit=${DRIVER_CASH_DEBT_LIMIT:100000}
numou.mobility.min-payout=${MIN_PAYOUT:50000}
numou.mobility.sweep-tenants=${SWEEP_TENANTS}
numou.mobility.sweep-interval=3s
numou.mobility.routing.osrm-url=${OSRM_URL:}
numou.mobility.routing.timeout=PT0.8S

# ---- Payments (credentials from the environment; a provider without one is not offered) ----
numou.payments.midtrans.server-key=${MIDTRANS_SERVER_KEY:}
numou.payments.xendit.callback-token=${XENDIT_CALLBACK_TOKEN:}
numou.payments.xendit.secret-key=${XENDIT_SECRET_KEY:}
numou.payments.partner.secret=${PARTNER_WEBHOOK_SECRET:}
numou.payments.topup.min=${TOPUP_MIN:10000}
numou.payments.topup.max=${TOPUP_MAX:5000000}

# ---- Observability ---------------------------------------------------------------------------
quarkus.log.console.json=true
quarkus.log.category."numou.access".level=INFO
quarkus.hibernate-orm.log.sql=false
quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://otel-collector:4317}
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${OTEL_SAMPLE_RATIO:0.05}
quarkus.otel.resource.attributes=service.namespace=numou,deployment.environment=${DEPLOY_ENV:prod}
quarkus.smallrye-openapi.path=/q/openapi

%dev.quarkus.oidc.devservices.enabled=true
%dev.quarkus.log.console.json=false
%dev.numou.mobility.secret=ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0wMTIzNDU2Nzg5
%dev.numou.mobility.sweep-tenants=00000000-0000-0000-0000-000000000001
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/numou?sslmode=disable
%dev.quarkus.datasource.reactive.url=postgresql://localhost:5432/numou
%dev.quarkus.datasource.reactive.postgresql.ssl-mode=disable
%dev.quarkus.datasource.username=numou_app
%dev.quarkus.datasource.password=numou_app
